name: Deploy to Azure App Service
run-name: "Env: ${{ inputs.azure_env }}"

on:
  workflow_dispatch:
    inputs:
      azure_env:
        type: environment
        description: Environment
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.azure_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./output

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ACTIVE_DIRECTORY_GHA_CLIENT_ID }}
          tenant-id: ${{ vars.ACTIVE_DIRECTORY_GHA_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          package: ./output

      - name: Set App Settings
        run: |
          az webapp config appsettings set \
            --name ${{ vars.APP_SERVICE_NAME }} \
            --resource-group {{ vars.RESOURCE_GROUP }} \
            --settings AzureAD__TenantId=${{ vars.AAD_TENANT_ID }} \
                       AzureAD__ClientId=${{ vars.AAD_CLIENT_ID }} \
                       AzureAD__ClientSecret=${{ secrets.AZURE_CLIENT_SECRET }}
